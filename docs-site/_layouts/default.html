<!DOCTYPE html>
<html lang="ar">
<head>
	<meta charset="UTF-8"/>
	<meta content="width=device-width, initial-scale=1" name="viewport"/>

	<!-- SEO (handles title, description, OG, Twitter, canonical) -->
	{% seo %}

	<!-- Styles -->
	<link href="{{ '/assets/css/main.css' | relative_url }}" rel="stylesheet">

	<!-- jQuery -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

	<!-- DataTables CSS & JS -->
	<link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet">
	<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

	<!-- Utilities -->
	<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

	<!-- Main JS -->
	<script src="{{ '/assets/js/main.js' | relative_url }}"></script>

	<!-- Structured Data -->
	<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "SoftwareSourceCode",
			"name": "{{ site.full_title }}",
			"description": "{{ site.description }}",
			"url": "{{ site.url }}",
			"codeRepository": "https://github.com/Chakib-DAII/Naftah",
			"programmingLanguage": "Naftah",
			"runtimePlatform": "JVM",
			"author": {
				"@type": "Person",
				"name": "Chakib-DAII"
			},
			"publisher": {
				"@type": "Organization",
				"name": "Naftah",
				"logo": {
					"@type": "ImageObject",
					"url": "{{ '/assets/images/logo.png' | absolute_url }}"
				}
			},
			"inLanguage": "ar"
		}
	</script>

</head>

<body>

<header class="site-header">
	<!--	<img alt="NaftahLang" src="{{ '/assets/images/logo.png' | relative_url }}"-->
	<!--		 style="height: 40px; vertical-align: middle; margin-right: 10px;">-->
	<div class="site-title">
		<a href="{{ '/' | absolute_url }}">
			{{ site.full_title }}
		</a>
	</div>

	<button class="menu-toggle">☰</button>

	{% include nav.html %}
</header>

<main class="site-content" {% if page.rtl %}dir="rtl"{% endif %}>
	{{ content }}
</main>

<footer class="site-footer">
	&copy; {{ "now" | date: "%Y" }} Naftah Lang - لغة برمجة نفطه
</footer>

<!-- Cloudflare Web Analytics -->
<script defer src="https://static.cloudflareinsights.com/beacon.min.js"
		data-cf-beacon='{"token": "68aacf910c9f46a28419fcd83af7a79e"}'></script>
<!-- End Cloudflare Web Analytics -->
</body>
</html>
